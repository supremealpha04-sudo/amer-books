<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amer Book Store · Pay · Unlock · Share</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ----- OFFICIAL COLORS ----- */
    :root {
      --brand-deep: #0B2B4A;
      --brand-gold: #F5B041;
      --brand-light: #FDF8F0;
      --brand-accent: #1E6F5C;
      --text-dark: #1E2A36;
      --text-soft: #3C4A5A;
      --card-white: #FFFFFF;
      --whatsapp: #25D366;
      --opay: #2D9CDB;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--brand-light);
      color: var(--text-dark);
      line-height: 1.5;
      padding: 1.5rem 1.5rem 4rem;
    }

    h1, h2, h3, .store-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ----- HEADER / STORE IDENTITY ----- */
    .store-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .logo-area h1 {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--brand-deep);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .logo-area h1 i {
      color: var(--brand-gold);
      font-size: 2.2rem;
    }

    .logo-area p {
      font-size: 1.1rem;
      color: var(--text-soft);
      font-weight: 400;
      border-bottom: 3px solid var(--brand-gold);
      display: inline-block;
      padding-bottom: 0.3rem;
    }

    /* auth status / buttons */
    .auth-area {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .user-greeting {
      background: var(--card-white);
      padding: 0.6rem 1.2rem;
      border-radius: 60px;
      font-weight: 500;
      color: var(--brand-deep);
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .user-greeting i {
      color: var(--brand-gold);
    }

    .btn-auth {
      background: var(--brand-deep);
      color: white;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 10px rgba(11, 43, 74, 0.15);
    }

    .btn-auth:hover {
      background: #0A1F33;
      transform: scale(1.02);
    }

    .btn-auth-outline {
      background: transparent;
      color: var(--brand-deep);
      border: 1.5px solid var(--brand-deep);
      box-shadow: none;
    }

    .btn-auth-outline:hover {
      background: #F1F5F9;
    }

    /* payment banner */
    .payment-banner {
      background: var(--card-white);
      padding: 0.9rem 1.5rem;
      border-radius: 60px;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem 2rem;
      margin: 1rem 0 0.5rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(11, 43, 74, 0.08);
      font-weight: 500;
      color: var(--brand-deep);
      font-size: 0.9rem;
    }

    .payment-banner i {
      margin-right: 0.4rem;
      color: var(--brand-accent);
    }

    .payment-banner .badge {
      background: #EAF6F2;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .payment-banner .badge i {
      color: var(--whatsapp);
      font-size: 1rem;
    }

    /* ----- TOOLBAR ----- */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      margin: 2rem 0 1.5rem;
    }

    .search-wrapper {
      flex: 1 1 260px;
      display: flex;
      align-items: center;
      background: var(--card-white);
      border-radius: 50px;
      padding: 0.4rem 0.4rem 0.4rem 1.5rem;
      border: 1px solid #E2E8F0;
      transition: 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .search-wrapper:focus-within {
      border-color: var(--brand-gold);
      box-shadow: 0 0 0 3px rgba(245, 176, 65, 0.15);
    }

    .search-wrapper i {
      color: #94A3B8;
    }

    .search-wrapper input {
      border: none;
      background: transparent;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      width: 100%;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .search-wrapper button {
      background: var(--brand-deep);
      border: none;
      color: white;
      padding: 0.7rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Poppins', sans-serif;
      white-space: nowrap;
    }

    .search-wrapper button:hover {
      background: #0A1F33;
    }

    .share-global {
      background: var(--brand-gold);
      border: none;
      color: var(--brand-deep);
      padding: 0.8rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.15s;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 4px 12px rgba(245, 176, 65, 0.3);
      white-space: nowrap;
    }

    .share-global:hover {
      background: #E5A32E;
      transform: scale(1.02);
    }

    /* ----- BOOK GRID ----- */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.8rem;
      margin-top: 1rem;
    }

    .book-card {
      background: var(--card-white);
      border-radius: 24px;
      padding: 1.6rem 1.3rem 1.6rem;
      box-shadow: 0 12px 28px -8px rgba(11, 43, 74, 0.08);
      transition: 0.25s ease;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(11, 43, 74, 0.05);
      position: relative;
    }

    .book-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 36px -12px rgba(11, 43, 74, 0.18);
      border-color: rgba(245, 176, 65, 0.4);
    }

    .book-cover {
      width: 100%;
      height: 150px;
      background: linear-gradient(145deg, #0B2B4A 0%, #1B4A6B 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.2rem;
      color: white;
      font-size: 2.6rem;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.1);
    }

    .book-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--brand-deep);
      line-height: 1.3;
      margin-bottom: 0.3rem;
    }

    .book-author {
      font-size: 0.9rem;
      color: var(--text-soft);
      margin-bottom: 0.6rem;
      font-weight: 500;
    }

    .book-desc {
      font-size: 0.9rem;
      color: #475569;
      margin-bottom: 1.2rem;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--brand-accent);
      font-family: 'Poppins', sans-serif;
    }

    .price small {
      font-size: 0.85rem;
      font-weight: 500;
      color: #64748B;
      margin-left: 2px;
    }

    .unlocked-badge {
      background: #E6F7EF;
      color: #0B6E4F;
      padding: 0.25rem 0.9rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .btn {
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: 0.15s;
      background: transparent;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--brand-accent);
      color: white;
      flex: 1;
      border: none;
    }

    .btn-primary:hover {
      background: #145A4A;
    }

    .btn-primary:disabled {
      background: #CBD5E1;
      color: #64748B;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-share {
      background: #F1F5F9;
      color: var(--brand-deep);
      border: 1px solid #E2E8F0;
      padding: 0.7rem 0.9rem;
    }

    .btn-share:hover {
      background: #E2E8F0;
    }

    .btn-unlock {
      background: var(--brand-gold);
      color: var(--brand-deep);
      flex: 1;
      border: none;
    }

    .btn-unlock:hover {
      background: #E5A32E;
    }

    .payment-hint {
      font-size: 0.7rem;
      color: #64748B;
      margin-top: 0.6rem;
      text-align: center;
      border-top: 1px dashed #E2E8F0;
      padding-top: 0.6rem;
    }

    /* ----- MODALS (ebook + auth) ----- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      max-width: 700px;
      width: 100%;
      border-radius: 32px;
      padding: 2.5rem;
      box-shadow: 0 40px 60px -20px rgba(0,0,0,0.4);
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      border: 1px solid rgba(245, 176, 65, 0.3);
    }

    .modal-content h2 {
      color: var(--brand-deep);
      margin-bottom: 1rem;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding-right: 2rem;
    }

    .ebook-text {
      background: #F8FAFC;
      padding: 1.8rem;
      border-radius: 20px;
      font-family: 'Inter', serif;
      line-height: 1.8;
      color: #0F172A;
      margin: 1.2rem 0;
      border-left: 6px solid var(--brand-gold);
      white-space: pre-wrap;
    }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #64748B;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }

    .modal-close:hover {
      background: #F1F5F9;
      color: var(--brand-deep);
    }

    /* ----- AUTH MODAL FORMS ----- */
    .auth-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.8rem;
      border-bottom: 2px solid #E2E8F0;
      padding-bottom: 0.8rem;
    }

    .auth-tab {
      background: none;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      color: #94A3B8;
      padding: 0.5rem 0.2rem;
      cursor: pointer;
      transition: 0.2s;
      border-bottom: 3px solid transparent;
      margin-bottom: -0.9rem;
    }

    .auth-tab.active {
      color: var(--brand-deep);
      border-bottom-color: var(--brand-gold);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .auth-form label {
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-dark);
      margin-bottom: 0.3rem;
      display: block;
    }

    .auth-form input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border-radius: 16px;
      border: 1.5px solid #E2E8F0;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      transition: 0.15s;
      background: #F8FAFC;
    }

    .auth-form input:focus {
      outline: none;
      border-color: var(--brand-gold);
      background: white;
      box-shadow: 0 0 0 3px rgba(245, 176, 65, 0.15);
    }

    .auth-btn {
      background: var(--brand-accent);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 40px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      margin-top: 0.5rem;
    }

    .auth-btn:hover {
      background: #145A4A;
    }

    .auth-message {
      font-size: 0.9rem;
      color: #EF4444;
      min-height: 1.5rem;
      margin-top: 0.5rem;
    }

    .auth-message.success {
      color: #0B6E4F;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--brand-deep);
      color: white;
      padding: 1rem 2rem;
      border-radius: 60px;
      font-weight: 500;
      opacity: 0;
      transition: 0.25s;
      z-index: 1100;
      box-shadow: 0 12px 20px -8px rgba(0,0,0,0.3);
      font-size: 0.95rem;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* footer */
    .footer-note {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #64748B;
      border-top: 1px solid #E2E8F0;
      padding-top: 2rem;
    }

    @media (max-width: 700px) {
      body { padding: 1rem 1rem 3rem; }
      .store-header { flex-direction: column; align-items: flex-start; }
      .logo-area h1 { font-size: 2rem; }
      .payment-banner { border-radius: 32px; gap: 0.8rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .share-global { justify-content: center; }
      .modal-content { padding: 1.8rem; }
      .book-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

      <button class="auth-tab" data-tab="register">Register</button>

    <!-- login form -->
    <form class="auth-form" id="loginForm">
      <div>
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div>

      <div>

      <div>

      <button type="submit" class="auth-btn">Create Account</button>

    </form>
  </div>
</div>

<!-- toast -->

    // ----- USER MANAGEMENT (localStorage, no backend) -----
    function getUsers() {
      const users = localStorage.getItem('amer_users');
      return users ? JSON.parse(users) : [];
    }

    function saveUsers(users) {
      localStorage.setItem('amer_users', JSON.stringify(users));
    }

    function getCurrentUser() {
      const email = localStorage.getItem('amer_currentUser');
      if (!email) return null;
      const users = getUsers();
      return users.find(u => u.email === email) || null;
    }

    function setCurrentUser(email) {
      if (email) {
        localStorage.setItem('amer_currentUser', email);
      } else {
        localStorage.removeItem('amer_currentUser');
      }
    }

    // Persist unlocked books per user
    function saveUnlockedBooks() {
      const user = getCurrentUser();
      if (!user) return;
      const users = getUsers();
      const idx = users.findIndex(u => u.email === user.email);
      if (idx !== -1) {
        users[idx].unlocked = books.filter(b => b.unlocked).map(b => b.id);
        saveUsers(users);
      }
    }

    function loadUnlockedBooks() {
      const user = getCurrentUser();
      if (!user) {
        // reset all to locked if no user
        books.forEach(b => b.unlocked = false);
        return;
      }
      const users = getUsers();
      const found = users.find(u => u.email === user.email);
      if (found && found.unlocked) {
        books.forEach(b => {
          b.unlocked = found.unlocked.includes(b.id);
        });
      } else {
        books.forEach(b => b.unlocked = false);
      }
    }

    // ----- DOM refs -----
    const bookGrid = document.getElementById('bookGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const shareStoreBtn = document.getElementById('shareStoreBtn');
    const ebookModal = document.getElementById('ebookModal');
    const modalBookTitle = document.getElementById('modalBookTitle');
    const ebookContent = document.getElementById('ebookContent');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const toast = document.getElementById('toastMsg');
    const authArea = document.getElementById('authArea');
    const authModal = document.getElementById('authModal');
    const closeAuthModalBtn = document.getElementById('closeAuthModalBtn');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginMessage = document.getElementById('loginMessage');
    const registerMessage = document.getElementById('registerMessage');

    // ----- TOAST -----
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // ----- RENDER AUTH AREA -----
    function renderAuthArea() {
      const user = getCurrentUser();
      if (user) {
        authArea.innerHTML = `
          <span class="user-greeting"><i class="fas fa-user-check"></i> ${user.name}</span>
          <button class="btn-auth btn-auth-outline" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          setCurrentUser(null);
          books.forEach(b => b.unlocked = false);
          renderAuthArea();
          renderBooks(searchInput.value);
          showToast('Logged out. Your unlocked books are saved.');
        });
      } else {
        authArea.innerHTML = `
          <button class="btn-auth" id="openAuthBtn"><i class="fas fa-user-plus"></i> Register / Login</button>
        `;
        document.getElementById('openAuthBtn').addEventListener('click', () => {
          authModal.classList.add('show');
          // reset forms
          loginForm.reset();
          registerForm.reset();
          loginMessage.textContent = '';
          registerMessage.textContent = '';
        });
      }
    }

    // ----- AUTH MODAL TABS -----
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        const target = e.target.dataset.tab;
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        if (target === 'login') {
          loginForm.style.display = 'flex';
          registerForm.style.display = 'none';
        } else {
          loginForm.style.display = 'none';
          registerForm.style.display = 'flex';
        }
      });
    });

    // ----- REGISTER -----
    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;

      if (!name || !email || !password) {
        registerMessage.textContent = 'Please fill all fields.';
        return;
      }
      if (password.length < 6) {
        registerMessage.textContent = 'Password must be at least 6 characters.';
        return;
      }

      const users = getUsers();
      if (users.find(u => u.email === email)) {
        registerMessage.textContent = 'Email already registered. Please login.';
        return;
      }

      users.push({ name, email, password, unlocked: [] });
      saveUsers(users);

      registerMessage.classList.add('success');
      registerMessage.textContent = 'Account created! You can now login.';
      registerForm.reset();
      setTimeout(() => {
        document.querySelector('.auth-tab[data-tab="login"]').click();
        registerMessage.textContent = '';
        registerMessage.classList.remove('success');
      }, 1500);
    });

    // ----- LOGIN -----
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      const users = getUsers();
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        loginMessage.textContent = 'Invalid email or password.';
        return;
      }

      setCurrentUser(email);
      loadUnlockedBooks();
      renderAuthArea();
      renderBooks(searchInput.value);
      authModal.classList.remove('show');
      loginForm.reset();
      loginMessage.textContent = '';
      showToast(`Welcome back, ${user.name}!`);
    });

    // ----- CLOSE AUTH MODAL -----
    closeAuthModalBtn.addEventListener('click', () => authModal.classList.remove('show'));
    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) authModal.classList.remove('show');
    });

    // ----- RENDER BOOKS -----
    function renderBooks(filterText = '') {
      const term = filterText.trim().toLowerCase();
      const filtered = books.filter(b =>
        b.title.toLowerCase().includes(term) ||
        b.author.toLowerCase().includes(term) ||
        b.description.toLowerCase().includes(term)
      );

      if (filtered.length === 0) {
        bookGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem; color:#64748B;">
          <i class="fas fa-book" style="font-size:2rem; opacity:0.5;"></i>
          <p style="margin-top:1rem;">No books match your search.</p>
        </div>`;
        return;
      }

      bookGrid.innerHTML = filtered.map(book => {
        const isUnlocked = book.unlocked;
        const shareMessage = `📚 Check out this book on Amer Book Store: "${book.title}" by ${book.author}. Pay ₦${book.price} to unlock. Send payment to Opay ${OPAY_ACCOUNT} (${ACCOUNT_NAME}) and WhatsApp ${WHATSAPP_NUMBER} with proof.`;
        const shareLink = `https://wa.me/?text=${encodeURIComponent(shareMessage)}`;

        let actionButtons = '';
        if (isUnlocked) {
          actionButtons = `<button class="btn btn-unlock" data-read="${book.id}"><i class="fas fa-book-open"></i> Read</button>`;
        } else {
          actionButtons = `<button class="btn btn-primary" data-pay="${book.id}"><i class="fas fa-lock"></i> Pay ₦${book.price.toLocaleString()}</button>`;
        }

        return `
          <div class="book-card" data-book-id="${book.id}">
            <div class="book-cover"><i class="fas ${book.coverIcon}"></i></div>
            <div class="book-title">${book.title}</div>
            <div class="book-author"><i class="fas fa-user-pen"></i> ${book.author}</div>
            <div class="book-desc">${book.description}</div>
            <div class="price-row">
              <span class="price">₦${book.price.toLocaleString()}</span>
              ${isUnlocked ? '<span class="unlocked-badge"><i class="fas fa-check-circle"></i> Unlocked</span>' : ''}
            </div>
            <div class="actions">
              ${actionButtons}
              <button class="btn btn-share" data-share='${shareLink.replace(/'/g, "\\'")}' title="Share on WhatsApp">
                <i class="fab fa-whatsapp"></i>
              </button>
            </div>
            <div class="payment-hint"><i class="fas fa-mobile-alt"></i> Opay: ${OPAY_ACCOUNT} · WhatsApp proof</div>
          </div>
        `;
      }).join('');

      // attach listeners
      document.querySelectorAll('[data-pay]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const bookId = e.currentTarget.dataset.pay;
          handlePayment(bookId);
        });
      });
      document.querySelectorAll('[data-read]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const bookId = e.currentTarget.dataset.read;
          openEbook(bookId);
        });
      });
      document.querySelectorAll('[data-share]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          window.open(e.currentTarget.dataset.share, '_blank');
          showToast('Opening WhatsApp to share...');
        });
      });
    }

    // ----- PAYMENT HANDLER -----
    function handlePayment(bookId) {
      const user = getCurrentUser();
      if (!user) {
        showToast('Please register or login to unlock books.');
        authModal.classList.add('show');
        return;
      }

      const book = books.find(b => b.id === bookId);
      if (!book || book.unlocked) return;

      const paymentInstructions = `📢 To unlock "${book.title}", pay ₦${book.price.toLocaleString()} to:
Opay: ${OPAY_ACCOUNT}
Name: ${ACCOUNT_NAME}
After payment, send proof to WhatsApp ${WHATSAPP_NUMBER}.
Click OK to simulate payment confirmation (demo).`;

      if (confirm(paymentInstructions + `\n\n(SIMULATE: Click OK if you have paid — this will unlock the book.)`)) {
        book.unlocked = true;
        saveUnlockedBooks();
        renderBooks(searchInput.value);
        showToast(`✅ "${book.title}" unlocked! Thank you for your payment.`);
      } else {
        showToast('Payment not confirmed. You can try again.');
      }
    }

    // ----- OPEN EBOOK -----
    function openEbook(bookId) {
      const book = books.find(b => b.id === bookId);
      if (!book) return;
      if (!book.unlocked) {
        showToast('Please pay to unlock this book.');
        return;
      }
      modalBookTitle.textContent = book.title;
      ebookContent.textContent = book.ebook;
      ebookModal.classList.add('show');
    }

    // close ebook modal
    closeModalBtn.addEventListener('click', () => ebookModal.classList.remove('show'));
    ebookModal.addEventListener('click', (e) => {
      if (e.target === ebookModal) ebookModal.classList.remove('show');
    });

    // ----- SEARCH -----
    function performSearch() { renderBooks(searchInput.value); }
    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') performSearch(); });

    // ----- SHARE STORE -----
    shareStoreBtn.addEventListener('click', () => {
      const storeShareText = `📚 Amer Book Store – pick millionaire knowledge. Pay via Opay ${OPAY_ACCOUNT} (${ACCOUNT_NAME}) and WhatsApp ${WHATSAPP_NUMBER}. Check it out!`;
      window.open(`https://wa.me/?text=${encodeURIComponent(storeShareText)}`, '_blank');
      showToast('Sharing store on WhatsApp...');
    });

    // ----- INIT -----
    function init() {
      loadUnlockedBooks();
      renderAuthArea();
      renderBooks();
    }

    init();
  })();
</script>
</body>
</html>
